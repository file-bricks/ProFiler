<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Vignette Gradient -->
    <radialGradient id="vignette" cx="30%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0.8" />
    </radialGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Lens Glass Gradient -->
    <linearGradient id="lens-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.02" />
    </linearGradient>

    <!-- Handle Gradient -->
    <linearGradient id="handle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b5563" />
      <stop offset="40%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Footprint Gradient -->
    <linearGradient id="footprint-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Fedora Gradient -->
    <linearGradient id="fedora-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-green" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <clipPath id="lens-clip">
      <circle cx="230" cy="200" r="53" />
    </clipPath>

    <!-- Footprint Path Template -->
    <path id="footprint" d="M 0 -15 C -4 -15, -5 -8, -5 0 C -5 5, -3 8, 0 8 C 3 8, 5 5, 5 0 C 5 -8, 4 -15, 0 -15 Z M 0 12 C -2 12, -3 14, -3 19 C -3 22, -2 23, 0 23 C 2 23, 3 22, 3 19 C 3 14, 2 12, 0 12 Z" />
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&amp;family=Space+Grotesk:wght@400;700&amp;display=swap');
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="340" fill="url(#bg-gradient)" />
  <rect width="1200" height="340" fill="url(#grid)" />
  <rect width="1200" height="340" fill="url(#vignette)" />

  <!-- SAFE ZONE DECORATIONS (Inside x:80..1120 y:60..300) -->
  <!-- Tech Corner Brackets -->
  <path d="M 95 90 L 95 75 L 110 75" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />
  <path d="M 1105 90 L 1105 75 L 1090 75" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />
  <path d="M 95 270 L 95 285 L 110 285" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />
  <path d="M 1105 270 L 1105 285 L 1090 285" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Case Number Tag -->
  <text x="1100" y="95" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#38bdf8" opacity="0.4" text-anchor="end">CASE NO: PF-91</text>
  <line x1="910" y1="91" x2="980" y2="91" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Left Side: Detective Footprint Trail -->
  <use href="#footprint" fill="url(#footprint-grad)" opacity="0.15" transform="translate(100, 265) rotate(-65) scale(0.65)" />
  <use href="#footprint" fill="url(#footprint-grad)" opacity="0.30" transform="translate(128, 248) rotate(-55) scale(0.65)" />
  <use href="#footprint" fill="url(#footprint-grad)" opacity="0.50" transform="translate(152, 226) rotate(-45) scale(0.65)" />
  <use href="#footprint" fill="url(#footprint-grad)" opacity="0.70" transform="translate(180, 212) rotate(-35) scale(0.65)" />
  <use href="#footprint" fill="url(#footprint-grad)" opacity="0.85" transform="translate(206, 192) rotate(-25) scale(0.65)" />

  <!-- Magnifying Glass Handle Under Hat -->
  <path d="M 269 239 L 315 285" stroke="url(#handle-grad)" stroke-width="10" stroke-linecap="round" />
  <path d="M 267 237 L 275 245" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" />
  <circle cx="315" cy="285" r="5" fill="#fbbf24" />

  <!-- Magnifying Glass Lens and Scanner -->
  <circle cx="230" cy="200" r="55" fill="url(#lens-glass)" stroke="url(#gold-grad)" stroke-width="4.5" filter="url(#drop-shadow)" />
  
  <!-- Fingerprint within Lens -->
  <g clip-path="url(#lens-clip)">
    <!-- Fingerprint loops -->
    <path d="M 230 240 C 230 225, 215 215, 215 200 C 215 185, 230 175, 245 185 C 255 192, 255 208, 245 215 C 240 220, 240 230, 240 240" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <path d="M 215 245 C 215 220, 200 200, 220 180 C 240 160, 265 175, 260 205 C 257 220, 250 230, 250 245" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <path d="M 200 250 C 200 210, 185 185, 215 160 C 245 135, 280 160, 275 210 C 272 225, 260 235, 260 250" fill="none" stroke="#0891b2" stroke-width="3" stroke-linecap="round" opacity="0.3" />
    
    <!-- Laser Scan Sweep -->
    <line x1="160" y1="200" x2="300" y2="200" stroke="#22d3ee" stroke-width="2.5" opacity="0.85" filter="url(#glow)" />
    <!-- Glass Reflection -->
    <ellipse cx="210" cy="170" rx="22" ry="10" transform="rotate(-30 210 170)" fill="#ffffff" opacity="0.15" />
  </g>

  <!-- Detective Fedora Hat (Layered on top of lens) -->
  <g filter="url(#drop-shadow)">
    <!-- Fedora Crown & Brim -->
    <path d="M 155 145 C 155 145, 175 140, 195 137 C 200 110, 215 95, 240 95 C 265 95, 280 110, 285 137 C 305 140, 325 145, 325 145 C 332 147, 327 151, 305 151 C 290 151, 275 146, 240 146 C 205 146, 190 151, 175 151 C 153 151, 148 147, 155 145 Z" fill="url(#fedora-grad)" />
    <!-- Fedora Gold Ribbon Band -->
    <path d="M 194 137 C 210 139, 270 139, 286 137 L 285 128 C 270 130, 210 130, 195 128 Z" fill="url(#gold-grad)" />
  </g>

  <!-- Right Side: Text & Brand Content -->
  <!-- Tech Scan Label -->
  <text x="435" y="105" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" letter-spacing="3" fill="#38bdf8" opacity="0.4">[SYS_PROFILING] 4F C2 E8 09 A1 C3 FF 8B</text>

  <!-- Wordmark "ProFiler" -->
  <text x="430" y="185" font-family="'Space Grotesk', sans-serif" font-size="82" font-weight="700" letter-spacing="-1.5" fill="#ffffff">
    Pro<tspan fill="#38bdf8">Filer</tspan><tspan fill="#fbbf24">.</tspan>
  </text>

  <!-- Tagline -->
  <text x="435" y="228" font-family="'Outfit', sans-serif" font-size="21" font-weight="300" letter-spacing="4.5" fill="#94a3b8">LOCAL DOCUMENT DETECTIVE</text>

  <!-- Badges -->
  <!-- Badge 1: SECURE PROFILE -->
  <rect x="435" y="252" width="165" height="24" rx="12" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
  <circle cx="452" cy="264" r="4.5" fill="#10b981" filter="url(#glow-green)" />
  <text x="466" y="268" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#38bdf8">SECURE PROFILE</text>

  <!-- Badge 2: ZERO CLOUD -->
  <rect x="615" y="252" width="120" height="24" rx="12" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1" />
  <text x="630" y="268" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#fbbf24">ZERO CLOUD</text>

</svg>
